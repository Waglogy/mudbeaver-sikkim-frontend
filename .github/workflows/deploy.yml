name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 image and export
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag mudbeaver-frontend:latest \
            --build-arg BACKEND_URL=${{ secrets.BACKEND_URL || 'http://mudbeaver-backend:4000' }} \
            --build-arg SITE_URL=${{ secrets.SITE_URL || 'https://mudbeaversikkim.in' }} \
            --output type=docker,dest=mudbeaver-frontend.tar \
            .

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer image to Oracle server
        run: |
          scp mudbeaver-frontend.tar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/mudbeaver-frontend.tar

      - name: Deploy on Oracle ARM server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            docker load -i /tmp/mudbeaver-frontend.tar
            docker network create mudbeaver-net 2>/dev/null || true
            docker stop mudbeaver-frontend || true
            docker rm mudbeaver-frontend || true
            docker run -d \
              --name mudbeaver-frontend \
              --network mudbeaver-net \
              --restart unless-stopped \
              -p 3008:3000 \
              mudbeaver-frontend:latest
            rm /tmp/mudbeaver-frontend.tar
            docker image prune -f
          EOF
